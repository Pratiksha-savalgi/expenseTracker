<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Option B+C — Register</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@600&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="demo-banner">Combined B+C · Soft panels + compact table · Prototype</div>
  <header class="top">
    <a class="brand" href="../index.html">Expense Tracker</a>
    <nav class="nav-links"><a href="login.html">Log in</a></nav>
  </header>
  <main class="auth-shell">
    <div class="panel">
      <h1>Create account</h1>
      <p class="sub">Set up your private expense space.</p>
      <form action="login.html" method="get">
        <label for="username">Username</label>
        <input id="username" placeholder="Choose a username" />
        <label for="password">Password</label>
        <input id="password" type="password" />
        <label for="confirm">Confirm password</label>
        <input id="confirm" type="password" />
        <div class="actions">
          <button class="btn btn-primary" type="submit">Register</button>
          <a class="btn btn-ghost" href="login.html">Cancel</a>
        </div>
      </form>
    </div>
  </main>
</body>
</html>
