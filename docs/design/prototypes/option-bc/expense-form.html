<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Option B+C — Add expense</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@600&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="demo-banner">Combined B+C · Soft panels + compact table · Prototype</div>
  <header class="top">
    <a class="brand" href="../index.html">Expense Tracker</a>
    <nav class="nav-links"><a href="expenses.html">Overview</a></nav>
  </header>
  <main class="shell" style="max-width:520px">
    <div class="panel">
      <h1>Add expense</h1>
      <p class="sub">Edit uses this same form with values filled in.</p>
      <form action="expenses.html" method="get">
        <div class="row-2">
          <div>
            <label for="amount">Amount</label>
            <input id="amount" type="number" step="0.01" value="450" />
          </div>
          <div>
            <label for="date">Date</label>
            <input id="date" type="date" value="2026-09-16" />
          </div>
        </div>
        <label for="category">Category</label>
        <select id="category">
          <option>Food</option>
          <option>Transport</option>
          <option>Housing</option>
          <option>Utilities</option>
          <option>Health</option>
          <option>Entertainment</option>
          <option>Shopping</option>
          <option>Education</option>
          <option>Other</option>
        </select>
        <label for="note">Note (optional)</label>
        <textarea id="note" rows="3">Lunch with friends</textarea>
        <div class="actions">
          <button class="btn btn-primary" type="submit">Save expense</button>
          <a class="btn btn-ghost" href="expenses.html">Cancel</a>
        </div>
      </form>
    </div>
  </main>
</body>
</html>
