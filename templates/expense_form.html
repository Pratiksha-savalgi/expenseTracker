{% extends "base.html" %}
{% block title %}{% if mode == 'edit' %}Edit{% else %}Add{% endif %} expense — Expense Tracker{% endblock %}
{% block content %}
<main class="shell" style="max-width:520px">
  <div class="panel">
    <h1>{% if mode == 'edit' %}Edit expense{% else %}Add expense{% endif %}</h1>
    <p class="sub">Amount, date, category, and an optional note.</p>
    <form method="post" action="{% if mode == 'edit' %}{{ url_for('edit_expense', expense_id=expense_id) }}{% else %}{{ url_for('add_expense') }}{% endif %}">
      <div class="row-2">
        <div>
          <label for="amount">Amount</label>
          <input id="amount" name="amount" type="number" step="0.01" min="0.01" required value="{{ form.amount }}" />
        </div>
        <div>
          <label for="date">Date</label>
          <input id="date" name="date" type="date" required value="{{ form.date }}" />
        </div>
      </div>
      <label for="category">Category</label>
      <select id="category" name="category" required>
        {% for cat in categories %}
          <option value="{{ cat }}" {% if form.category == cat %}selected{% endif %}>{{ cat }}</option>
        {% endfor %}
      </select>
      <label for="note">Note (optional)</label>
      <textarea id="note" name="note" rows="3">{{ form.note }}</textarea>
      <div class="actions">
        <button class="btn btn-primary" type="submit">Save expense</button>
        <a class="btn btn-ghost" href="{{ url_for('expenses') }}">Cancel</a>
      </div>
    </form>
  </div>
</main>
{% endblock %}
